# Package metadata. Required.
package:
  # The name of the package. Required.
  name: cnn-core-wrapper

  # The list of package authors and contributors. Optional.
  # By convention, authors should be listed in the form shown below.
  authors: ["Albert Cheung <albert.cheung@cern.ch>"]

  # Other packages this package depends on. Optional.
dependencies:
  cnn-core: { git: "git@github.com:NuDAQ/CNN-Core-Generator.git", rev: "eca9b12f9f49f4b7324ed9ed241a44086ca9c842" }

sources:
  # RTL sources
  - hw/rtl/cnn_core_wrapper_top.v

  # Standalone verification only; consumers select their own top/testbench.
  - target: all(simulation, cnn_wrapper_test)
    files:
      - tests/tb_native_wrapper.sv

  # System consumers own their clocks and constraints.
  - target: all(fpga, synthesis, cnn_wrapper_ooc)
    files:
      - hw/xdc/wrapper_ooc.xdc
